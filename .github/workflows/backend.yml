# Backend → Azure Container Apps.
# Construye la imagen en GitHub (no en local), la publica en GitHub Container
# Registry y actualiza la container app. Azure se autentica con OIDC: no hay
# contraseñas guardadas, solo los IDs de la identidad en los secrets del repo.
name: Backend

on:
  push:
    branches: [master]
    paths:
      - core/server/**
      - docker/Dockerfile.server
      - .github/workflows/backend.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: backend-deploy
  cancel-in-progress: false

env:
  IMAGEN: ghcr.io/arcgabicho/compipro-crm-api
  GRUPO: rg-compipro
  APP: compipro-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar la imagen nueva
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update -g "$GRUPO" -n "$APP" --image "$IMAGEN:${{ github.sha }}" -o none
