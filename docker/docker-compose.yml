# Stack completo del Sistema CRM Compina.
#   docker compose -f docker/docker-compose.yml up --build
#
# Variables (con valores por defecto para desarrollo). Sobrescríbelas en
# docker/.env o en el entorno para producción.

name: sistema-crm-compipro

services:
  # ---------------------------------------------------------------------------
  # Backend .NET (EF Core + Azure SQL). Crea el esquema y siembra el admin y la demo.
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "${DB_CONNECTION_STRING:?Define DB_CONNECTION_STRING en el .env (cadena de Azure SQL)}"
      Jwt__Key: "${JWT_KEY:-fg9H65NPCIzoiY_4zmozOWfcVNmGZFsfSkp9EQUMNBw}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Seed__Admin__Email: "${SEED_ADMIN_EMAIL:-admin@compipro.net}"
      Seed__Admin__Name: "${SEED_ADMIN_NAME:-Administrador}"
      Seed__Admin__Password: "${SEED_ADMIN_PASSWORD:-Compipro2025!}"
    ports:
      - "5008:8080"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend Next.js (BFF: fija la cookie HttpOnly, valida el JWT en proxy.ts)
  # ---------------------------------------------------------------------------
  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      args:
        SITE_URL: "${SITE_URL:-https://compipro.net}"
    depends_on:
      server:
        condition: service_started
    environment:
      NODE_ENV: "production"
      BACKEND_URL: "http://server:8080"
      AUTH_JWT_SECRET: "${JWT_KEY:-fg9H65NPCIzoiY_4zmozOWfcVNmGZFsfSkp9EQUMNBw}"
    ports:
      - "3000:3000"
    restart: unless-stopped
