# Stack completo del Sistema CRM Compina.
#   docker compose -f docker/docker-compose.yml up --build
#
# Variables (con valores por defecto para desarrollo). Sobrescríbelas en
# docker/.env o en el entorno para producción.

name: sistema-crm-compipro

services:
  # ---------------------------------------------------------------------------
  # Backend .NET (EF Core + Azure SQL). Crea el esquema y siembra el admin y la demo.
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "${DB_CONNECTION_STRING:?Define DB_CONNECTION_STRING en el .env (cadena de Azure SQL)}"
      Jwt__Key: "${JWT_KEY:-fg9H65NPCIzoiY_4zmozOWfcVNmGZFsfSkp9EQUMNBw}"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      Seed__Admin__Email: "${SEED_ADMIN_EMAIL:-admin@compipro.net}"
      Seed__Admin__Name: "${SEED_ADMIN_NAME:-Administrador}"
      Seed__Admin__Password: "${SEED_ADMIN_PASSWORD:-Compipro2025!}"
      # Correo: por defecto al Mailpit de abajo (bandeja en http://localhost:8025;
      # nada sale a internet). SMTP real: SMTP_HOST=… y EMAIL_SANDBOX=false.
      Email__Remitente: "${EMAIL_REMITENTE:-crm@compipro.net}"
      Email__UrlPublica: "${EMAIL_URL_PUBLICA:-http://localhost:5008}"
      Email__Sandbox: "${EMAIL_SANDBOX:-true}"
      Email__UrlBandeja: "${EMAIL_URL_BANDEJA:-http://localhost:8025}"
      Email__Smtp__Host: "${SMTP_HOST:-mailpit}"
      Email__Smtp__Puerto: "${SMTP_PUERTO:-1025}"
      Email__Smtp__Usuario: "${SMTP_USUARIO:-}"
      Email__Smtp__Contrasena: "${SMTP_CONTRASENA:-}"
      # Archivos: Local (volumen de abajo) o S3 (Cloudflare R2, AWS S3, MinIO).
      Almacenamiento__Proveedor: "${ALMACENAMIENTO:-Local}"
      Almacenamiento__S3__Endpoint: "${S3_ENDPOINT:-}"
      Almacenamiento__S3__Bucket: "${S3_BUCKET:-}"
      Almacenamiento__S3__AccessKey: "${S3_ACCESS_KEY:-}"
      Almacenamiento__S3__SecretKey: "${S3_SECRET_KEY:-}"
    volumes:
      - archivos:/app/storage
    ports:
      - "5008:8080"
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Frontend Next.js (BFF: fija la cookie HttpOnly, valida el JWT en proxy.ts)
  # ---------------------------------------------------------------------------
  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      args:
        SITE_URL: "${SITE_URL:-https://compipro.net}"
    depends_on:
      server:
        condition: service_started
    environment:
      NODE_ENV: "production"
      BACKEND_URL: "http://server:8080"
      AUTH_JWT_SECRET: "${JWT_KEY:-fg9H65NPCIzoiY_4zmozOWfcVNmGZFsfSkp9EQUMNBw}"
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mailpit: SMTP de pruebas con bandeja web. Atrapa todos los correos.
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_MAX_AGE: "1d"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: "America/Lima"
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  # Documentos subidos con el almacenamiento Local.
  archivos:
